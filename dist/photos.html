<style>
  :root {
    --cloud: #e9ece9;      /* the cloud bank */
    --paper: #f5f6f4;
    --slate: #26312d;      /* crater slope in shadow */
    --slate-soft: #4c5a54;
    --grass: #9c7433;      /* dry savanna grass */
    --lagoon: #3f6f6b;     /* shallow reef water */
    --rule: #cfd5d1;
    --bg: var(--paper);
    --fg: var(--slate);
    --muted: var(--slate-soft);
    --link: var(--lagoon);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b2320; --fg: #e3e8e4; --muted: #a9b5af; --link: #8fc2bc; --rule: #34413c; --grass: #d1a660;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b2320; --fg: #e3e8e4; --muted: #a9b5af; --link: #8fc2bc; --rule: #34413c; --grass: #d1a660;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Literata", Georgia, serif; font-size: 1.125rem; line-height: 1.65;
    font-optical-sizing: auto;
  }
  a { color: var(--link); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--grass); outline-offset: 3px; }

  main { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }

  .gallery-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; padding: clamp(40px, 7vw, 72px) 0 1.25rem; }
  .gallery-head h2 { margin: 0; font-weight: 400; font-size: clamp(1.6rem, 3vw, 2.1rem); letter-spacing: -0.01em; }
  .gallery-head p { margin: 0; color: var(--muted); font-size: 0.98rem; }

  /* Editorial grid: images keep their own proportions */
  .gallery {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(10px, 1.5vw, 18px); margin: 0; padding: 0; list-style: none;
  }
  .gallery li { margin: 0; }
  .gallery li.w6 { grid-column: span 6; }
  .gallery li.w4 { grid-column: span 4; }
  .gallery li.w3 { grid-column: span 3; }
  .gallery li.w2 { grid-column: span 2; }
  .gallery button {
    all: unset; display: block; width: 100%; cursor: zoom-in; border-radius: 2px;
  }
  .gallery button:focus-visible { outline: 2px solid var(--grass); outline-offset: 4px; }
  .gallery img { display: block; width: 100%; height: 100%; object-fit: cover; aspect-ratio: var(--ar, 3/2); border-radius: 2px; }
  .gallery figcaption { margin-top: 0.45rem; font-size: 0.9rem; color: var(--muted); }

  footer { max-width: 1180px; margin: 0 auto; padding: clamp(48px, 8vw, 96px) clamp(16px, 4vw, 48px) 40px; color: var(--muted); font-size: 0.95rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  /* Lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
  dialog::backdrop { background: rgba(17, 22, 20, 0.92); }
  dialog img { display: block; max-width: 96vw; max-height: 86vh; object-fit: contain; }
  dialog p { margin: 0.6rem 0 0; color: #dfe5e1; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 1rem; }
  dialog button { all: unset; cursor: pointer; color: #dfe5e1; text-decoration: underline; text-underline-offset: 0.2em; }
  dialog button:focus-visible { outline: 2px solid #d1a660; outline-offset: 3px; }

  @media (max-width: 760px) {
    .gallery { grid-template-columns: 1fr 1fr; }
    .gallery li.w4, .gallery li.w3, .gallery li.w2 { grid-column: span 2; }
  }

  .topbar { max-width: 1180px; margin: 0 auto; padding: 1.25rem clamp(16px, 4vw, 48px); display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
  .topbar .name { color: var(--fg); text-decoration: none; font-weight: 500; font-size: 1.15rem; }
  .topbar nav { display: flex; gap: 1.25rem; font-size: 1rem; }
  .topbar nav a { text-decoration: none; }
  .topbar nav a[aria-current="page"] { color: var(--grass); }
  .page-head { padding: clamp(40px, 7vw, 80px) 0 1.5rem; }
  .page-head h1 { margin: 0; font-weight: 350; letter-spacing: -0.02em; line-height: 1; font-size: clamp(2.4rem, 6vw, 4.5rem); }
  .page-head p { max-width: 40rem; margin: 0.9rem 0 0; color: var(--muted); }
</style>
</head>
<body>

<header class="topbar">
  <a class="name" href="/">Levi Skye Morris</a>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/cv">CV</a>
    <a href="/photos" aria-current="page">Photography</a>
  </nav>
</header>

<main>
  <div class="page-head">
    <h1>Wildlife photography</h1>
    <p>Wildlife, from far away and close to home.</p>
  </div>
  <section aria-label="Photographs">
    <ul class="gallery">
      <li class="w6"><figure style="margin:0"><button data-full="img/pika.jpg" aria-label="Open: Pika"><img src="img/pika.jpg" alt="An American pika in the alpine tundra of Colorado" style="--ar:16/9" loading="lazy"></button><figcaption>American pika</figcaption></figure></li>
      <li class="w4"><figure style="margin:0"><button data-full="img/cubs.jpg" aria-label="Open: Lion cubs"><img src="img/cubs.jpg" alt="Two lion cubs curled together in the grass, one looking straight at the camera" style="--ar:3/2" loading="lazy"></button><figcaption>Lion cubs</figcaption></figure></li>
      <li class="w2"><figure style="margin:0"><button data-full="img/roller.jpg" aria-label="Open: Lilac-breasted roller"><img src="img/roller.jpg" alt="A lilac-breasted roller perched on a thorny branch against dry grass" style="--ar:3/4;object-position:25% 50%" loading="lazy"></button><figcaption>Lilac-breasted roller</figcaption></figure></li>
      <li class="w3"><figure style="margin:0"><button data-full="img/hippo.jpg" aria-label="Open: Hippopotamus"><img src="img/hippo.jpg" alt="A hippopotamus in the water with its mouth wide open, tusks showing" style="--ar:4/3" loading="lazy"></button><figcaption>Hippopotamus</figcaption></figure></li>
      <li class="w3"><figure style="margin:0"><button data-full="img/fox.jpg" aria-label="Open: Red fox"><img src="img/fox.jpg" alt="A red fox standing in green grass, looking back at the camera" style="--ar:4/3" loading="lazy"></button><figcaption>Red fox</figcaption></figure></li>
      <li class="w2"><figure style="margin:0"><button data-full="img/silver-fox.jpg" aria-label="Open: Silver fox"><img src="img/silver-fox.jpg" alt="A silver fox sitting on a gravel path" style="--ar:3/4" loading="lazy"></button><figcaption>Silver fox</figcaption></figure></li>
      <li class="w4"><figure style="margin:0"><button data-full="img/foxes-grooming.jpg" aria-label="Open: Foxes grooming"><img src="img/foxes-grooming.jpg" alt="Two subadult foxes, one grooming the other after a storm." style="--ar:3/2" loading="lazy"></button><figcaption>Subadult foxes grooming</figcaption></figure></li>
      <li class="w4"><figure style="margin:0"><button data-full="img/monk-seals.jpg" aria-label="Open: Monk seals"><img src="img/monk-seals.jpg" alt="Two monk seals nose to nose on a sandy beach at the water's edge" style="--ar:3/2" loading="lazy"></button><figcaption>Monk seals</figcaption></figure></li>
      <li class="w2"><figure style="margin:0"><button data-full="img/crater-lion.jpg" aria-label="Open: Lion beneath the crater rim"><img src="img/crater-lion.jpg" alt="A lion sitting in dry grass beneath a cloud-covered crater wall" style="--ar:3/4;object-position:28% 50%" loading="lazy"></button><figcaption>Lion beneath the crater rim</figcaption></figure></li>
    </ul>
  </section>
</main>

<footer>
  <span>Boulder County, Colorado</span>
  <span>Photographs © Levi Skye Morris</span>
</footer>

<dialog id="lightbox" aria-label="Photograph">
  <img id="lb-img" alt="">
  <p><span id="lb-cap"></span><button id="lb-close">Close</button></p>
</dialog>

<script>
  const dlg = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  const cap = document.getElementById('lb-cap');
  document.querySelectorAll('.gallery button').forEach(b => {
    b.addEventListener('click', () => {
      const thumb = b.querySelector('img');
      img.src = b.dataset.full; img.alt = thumb.alt;
      cap.textContent = b.closest('figure').querySelector('figcaption').textContent;
      dlg.showModal();
    });
  });
  document.getElementById('lb-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
